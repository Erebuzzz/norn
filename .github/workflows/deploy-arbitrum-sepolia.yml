name: Deploy policy to Arbitrum Sepolia

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CREANCE_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
  CREANCE_EXPLORER_BASE: https://sepolia.arbiscan.io

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - name: Deploy policy
        id: deploy
        env:
          CREANCE_PRIVATE_KEY: ${{ secrets.CREANCE_TESTNET_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:policy | tee deploy.log
          address=$(sed -n 's/^CREANCE_POLICY_ADDRESS=//p' deploy.log | tail -1)
          test -n "$address"
          echo "policy_address=$address" >> "$GITHUB_OUTPUT"
          echo "### Arbitrum Sepolia deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Policy: [$address](https://sepolia.arbiscan.io/address/$address)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remote policy smoke
        env:
          CREANCE_PRIVATE_KEY: ${{ secrets.CREANCE_TESTNET_PRIVATE_KEY }}
          CREANCE_POLICY_ADDRESS: ${{ steps.deploy.outputs.policy_address }}
        run: npm run demo:chain | tee smoke.log
      - name: Preserve public proof logs
        uses: actions/upload-artifact@v4
        with:
          name: arbitrum-sepolia-proof
          path: |
            deploy.log
            smoke.log
          retention-days: 7
