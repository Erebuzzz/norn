white_space_opportunities:
  - Enforceable treasury mandate / policy contract as the product (not AI alpha).
  - Intent vs execution separation with onchain audit trail for autonomous agents.
  - Policy-capped Pendle / structured yield (currently uncontested).
  - Compose with RWA Guard-style deny-by-default checks inside spend/rebalance authority.
  - Stylus for policy or risk math to stand out vs Solidity-only pack.
  - Avoid "AI hedge fund / smart stock-token allocator" framing (crowded conceptually).

creance_win_implications:
  - Pitch control plane and mandate enforcement, never "AI that trades stock tokens."
  - Ship explorer-linked blocked + approved intent demos on Robinhood Chain or Arbitrum to match Gage/INSTANT WIN/ETour live bar.
  - Position RWA Guard as complementary input to policy, not a competing thesis.
  - If using Pendle, show depth under policy ceilings; otherwise stay clear and own treasury OS narrative.
  - Demo and writeup must be concrete (addresses, tests, known limits) like INSTANT WIN/sakartvelo; hide agent theater.

recommended_next_steps:
  - Re-scrape Project Gallery weekly until Oct 4; diff new RWA/AI/treasury entrants.
  - Align Creance HackQuest listing copy with concrete deploy + decision-trail demo.
  - Decide Pendle: skip vs own as policy-bound yield module.
  - Optional: wire demo narrative to RWA Guard-like safety bits for judge storytelling.
