key_findings:
  - Gallery is early (~12 live projects) and dominated by Robinhood Chain / tokenized-stock RWA themes.
  - Strongest judge patterns: live mainnet or verified Arb One deploys, concrete addresses, tests, honest limitations.
  - Top-tier competitors by polish/fit: Gage.cash (RH mainnet lending), INSTANT WIN (distribution + VRF on Arb One), ETour (onchain tournaments), RWA Guard (deny-by-default RWA safety view), JUJING (stock-token verification product).
  - AI cluster is marketplace/scoring (BotHire, LaunchLens, Trestle AI claims), not enforceable treasury policy.
  - Pendle / PT-YT / structured yield: no visible depth in gallery.
  - Treasury control plane / mandate-enforced autonomous execution: empty (Creance white space).
  - Weak pattern: buzzword stacks (DeFi+RWA+AI) without a single undeniable demo moment (Trestle); broken demo video hurts BotHire page.
  - Stylus mostly unused except MWA hybrid; opportunity if it strengthens policy/risk math story.
  - Card numbers (e.g. 8827) are engagement counters, not judge scores.

